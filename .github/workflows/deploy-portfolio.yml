name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - "portfolio/**"
      - ".github/workflows/deploy-portfolio.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage portfolio
        run: |
          mkdir -p _site/portfolio _site/SensorFusionXR/viewer
          cp -R portfolio/headmount _site/portfolio/
          cp -R portfolio/assembly-viewer _site/portfolio/
          cp -R portfolio/assembly-viewer/dossier/. _site/SensorFusionXR/
          cp portfolio/assembly-viewer/index.html _site/SensorFusionXR/viewer/index.html
          cp -R portfolio/assembly-viewer/assets _site/SensorFusionXR/viewer/
          cp -R portfolio/assembly-viewer/models _site/SensorFusionXR/viewer/
          sed -i \
            -e 's#\.\./dossier/#./#g' \
            -e 's#src="../?embed=dossier"#src="./viewer/?embed=dossier"#g' \
            -e 's#href="../"#href="./viewer/"#g' \
            _site/SensorFusionXR/index.html
          cp portfolio/pages-index.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
