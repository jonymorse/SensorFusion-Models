<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Headmount Assembly Viewer</title>
    <script>
      (() => {
        const savedTheme = localStorage.getItem('theme');
        const theme = savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="page">
      <header>
        <a class="owner" href="https://jonymorse.com">Jonathan Morse</a>
        <nav aria-label="Primary navigation">
          <a href="https://github.com/jonymorse/SensorFusion-Models">Source</a>
          <a href="mailto:jemorse55@gmail.com">Contact</a>
          <button class="theme-toggle" type="button" aria-label="Switch color theme" title="Switch color theme">
            <span aria-hidden="true"></span>
          </button>
        </nav>
      </header>

      <main>
        <section class="model-stage" aria-live="polite">
          <div id="three-view" aria-label="Interactive 3D view of the MQ3S mount base"></div>
          <span class="loading" id="loading">Loading 3D geometry…</span>
        </section>

        <aside class="model-description">
          <p class="eyebrow">Hardware / Prototype</p>
          <h2>Meta Quest 3S mount</h2>
          <p>A custom headset mount with a GoPro-compatible attachment underneath for securing a camera or sensor.</p>
          <p class="interaction">Drag to rotate · Scroll to zoom</p>
        </aside>
      </main>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js",
          "three/addons/": "./vendor/three/addons/"
        }
      }
    </script>
    <script type="module" src="./script.js"></script>
  </body>
</html>
