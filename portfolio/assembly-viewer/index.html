<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      if (window.location.pathname.endsWith("/dossier")) {
        window.location.replace(`${window.location.pathname}/${window.location.search}${window.location.hash}`);
      }
    </script>
    <meta
      name="description"
      content="Interactive exploded view of the Quest 3S sensor-fusion assembly."
    />
    <title>Quest 3S Sensor Fusion Assembly</title>
    <script type="module" crossorigin src="./assets/viewer-B8XBbwhQ.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/OrbitControls-qb7j3oR3.js">
    <link rel="stylesheet" crossorigin href="./assets/viewer-BxEF9m8C.css">
    <style>
      body.embed-dossier .explode-panel {
        grid-template-columns: 112px minmax(110px, 1fr) 82px;
      }

      @media (max-width: 860px) {
        .explode-panel {
          grid-template-columns: 78px minmax(70px, 1fr) 72px;
        }
      }

      @media (max-width: 540px) {
        .explode-panel {
          grid-template-columns: 70px minmax(54px, 1fr) 66px;
        }
      }

      .viewer-loader {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        color: rgba(255, 248, 240, .54);
        background:
          radial-gradient(circle at 50% 46%, rgba(229, 111, 58, .08), transparent 24%),
          #090a09;
        opacity: 1;
        visibility: visible;
        transition: opacity 240ms ease, visibility 0s linear 240ms;
      }

      .viewer-loader-inner {
        display: flex;
        align-items: center;
        gap: 10px;
        font: 8px/1 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        text-transform: uppercase;
        letter-spacing: .12em;
      }

      .viewer-loader-track {
        position: relative;
        width: 28px;
        height: 1px;
        overflow: hidden;
        background: rgba(255, 248, 240, .18);
      }

      .viewer-loader-track::after {
        content: "";
        position: absolute;
        inset: 0;
        background: #e56f3a;
        animation: viewerLoaderTrack 1.25s ease-in-out infinite;
      }

      .viewer-loader-error { display: none; }

      html.model-ready .viewer-loader {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      html.model-error .viewer-loader-copy { display: none; }
      html.model-error .viewer-loader-error { display: inline; }
      html.model-error .viewer-loader-track::after {
        transform: none;
        animation: none;
      }

      @keyframes viewerLoaderTrack {
        0% { transform: translateX(-100%); }
        55%, 100% { transform: translateX(100%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .viewer-loader,
        .viewer-loader-track::after {
          animation: none;
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="viewer-loader" role="status" aria-live="polite">
      <div class="viewer-loader-inner">
        <span class="viewer-loader-track" aria-hidden="true"></span>
        <span class="viewer-loader-copy">Loading assembly</span>
        <span class="viewer-loader-error">Assembly unavailable</span>
      </div>
    </div>
    <main class="app-shell">
      <canvas id="assembly-canvas" aria-label="Interactive 3D assembly viewer"></canvas>

      <header class="masthead">
        <div class="wordmark">
          <span class="wordmark-dot"></span>
          <span class="wordmark-label">HW-01 / SENSOR FUSION ASSEMBLY</span>
        </div>
        <div class="view-actions" aria-label="Camera views">
          <button type="button" data-view="front" class="active">Front</button>
          <button type="button" data-view="side">Side</button>
          <button type="button" data-view="iso">ISO</button>
          <button type="button" id="reset-view">Reset</button>
        </div>
      </header>

      <div class="control-stack">
      <aside class="parts-panel">
        <div class="parts-heading">
          <div>
            <p class="eyebrow">COMPONENT INDEX</p>
            <h2>9 parts</h2>
          </div>
          <button
            type="button"
            id="toggle-parts"
            aria-label="Close component index"
            aria-expanded="true"
          >−</button>
        </div>
        <div id="parts-list" class="parts-list"></div>
      </aside>

      <section class="explode-panel">
        <div class="explode-copy">
          <p class="eyebrow">EXPLODED VIEW</p>
          <strong id="explode-readout">ASSEMBLED</strong>
        </div>
        <input
          id="explode-slider"
          type="range"
          min="0"
          max="100"
          value="0"
          aria-label="Exploded view amount"
        />
        <button type="button" id="explode-toggle">Explode</button>
      </section>
      </div>

      <div class="selection-card" id="selection-card" hidden>
        <p class="eyebrow">SEL</p>
        <strong id="selection-name"></strong>
        <button type="button" id="clear-selection" aria-label="Clear selected component">×</button>
      </div>
    </main>
    <script>
      const partsList = document.getElementById('parts-list');
      const modelLoadTimeout = window.setTimeout(() => {
        document.documentElement.classList.add('model-error');
      }, 20000);
      const modelObserver = new MutationObserver(() => {
        if (!partsList.children.length) return;
        window.clearTimeout(modelLoadTimeout);
        document.documentElement.classList.remove('model-error');
        document.documentElement.classList.add('model-ready');
        modelObserver.disconnect();
      });
      modelObserver.observe(partsList, { childList: true });
    </script>
  </body>
</html>
