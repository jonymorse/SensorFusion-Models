<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      if (window.location.pathname.endsWith("/dossier")) {
        window.location.replace(`${window.location.pathname}/${window.location.search}${window.location.hash}`);
      }
    </script>
    <meta
      name="description"
      content="Interactive exploded view of the Quest 3S sensor-fusion assembly."
    />
    <title>Quest 3S Sensor Fusion Assembly</title>
    <script type="module" crossorigin src="./assets/viewer-B8XBbwhQ.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/OrbitControls-qb7j3oR3.js">
    <link rel="stylesheet" crossorigin href="./assets/viewer-BxEF9m8C.css">
  </head>
  <body>
    <main class="app-shell">
      <canvas id="assembly-canvas" aria-label="Interactive 3D assembly viewer"></canvas>

      <header class="masthead">
        <div class="wordmark">
          <span class="wordmark-dot"></span>
          <span class="wordmark-label">HW-01 / SENSOR FUSION ASSEMBLY</span>
        </div>
        <div class="view-actions" aria-label="Camera views">
          <button type="button" data-view="front" class="active">Front</button>
          <button type="button" data-view="side">Side</button>
          <button type="button" data-view="iso">ISO</button>
          <button type="button" id="reset-view">Reset</button>
        </div>
      </header>

      <div class="control-stack">
      <aside class="parts-panel">
        <div class="parts-heading">
          <div>
            <p class="eyebrow">COMPONENT INDEX</p>
            <h2>9 parts</h2>
          </div>
          <button
            type="button"
            id="toggle-parts"
            aria-label="Close component index"
            aria-expanded="true"
          >−</button>
        </div>
        <div id="parts-list" class="parts-list"></div>
      </aside>

      <section class="explode-panel">
        <div class="explode-copy">
          <p class="eyebrow">EXPLODED VIEW</p>
          <strong id="explode-readout">ASSEMBLED</strong>
        </div>
        <input
          id="explode-slider"
          type="range"
          min="0"
          max="100"
          value="0"
          aria-label="Exploded view amount"
        />
        <button type="button" id="explode-toggle">Explode</button>
        <a class="viewer-link" href="./" target="_blank" rel="noreferrer">Full viewer ↗</a>
      </section>
      </div>

      <div class="selection-card" id="selection-card" hidden>
        <p class="eyebrow">SEL</p>
        <strong id="selection-name"></strong>
        <button type="button" id="clear-selection" aria-label="Clear selected component">×</button>
      </div>
    </main>
  </body>
</html>
