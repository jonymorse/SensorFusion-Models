<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thermal calibration target</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body, #viewer { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body {
        color: rgba(255, 255, 255, .82);
        background:
          radial-gradient(circle at 64% 24%, rgba(255, 255, 255, .08), transparent 34%),
          linear-gradient(145deg, #151918, #080a09);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      .status,
      .hint {
        position: fixed;
        z-index: 2;
        pointer-events: none;
        text-transform: uppercase;
        letter-spacing: .12em;
        font-size: 9px;
      }
      .status { top: 14px; left: 15px; color: rgba(255,255,255,.44); }
      .hint {
        right: 14px;
        bottom: 13px;
        padding: 7px 9px;
        border: 1px solid rgba(255,255,255,.11);
        border-radius: 999px;
        color: rgba(255,255,255,.58);
        background: rgba(7,9,8,.52);
        backdrop-filter: blur(10px);
      }
      body.ready .status { opacity: 0; transition: opacity 240ms ease; }
      @media (max-width: 520px) {
        .hint { right: 10px; bottom: 10px; font-size: 8px; }
      }
    </style>
    <script type="module" crossorigin src="../../assets/calibrationTarget-DXVe7nIS.js"></script>
    <link rel="modulepreload" crossorigin href="../../assets/OrbitControls-qb7j3oR3.js">
  </head>
  <body>
    <div id="viewer" aria-label="Interactive 3D model of the heated thermal calibration target"></div>
    <div class="status" id="status">Loading target</div>
    <div class="hint">Drag to rotate · scroll to zoom</div>
  </body>
</html>
